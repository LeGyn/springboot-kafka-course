name: Security gates

on:
  pull_request:
  push:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scanners:
    name: security-scanners
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Scan source code
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" semgrep/semgrep:1.182.0 semgrep scan --config p/security-audit --error /src

      - name: Scan dependencies, secrets and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
